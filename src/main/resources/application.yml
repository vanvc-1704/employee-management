spring:
  application:
    name: employee-management
  profiles:
    default: dev
  cache:
    type: caffeine
    cache-names: employeeCount
    caffeine:
      spec: maximumSize=500,expireAfterWrite=60s
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 8080

logging:
  level:
    root: INFO
    com.example.employeemanagement: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,caches
  endpoint:
    health:
      show-details: always
