<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kết quả tìm kiếm</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .search-info { margin-bottom: 20px; padding: 10px; background-color: #e7f3ff; border-left: 4px solid #0066cc; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        table th, table td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        table th { background-color: #f2f2f2; font-weight: bold; }
        table tr:hover { background-color: #f5f5f5; }
        a { color: #0066cc; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .btn { display: inline-block; padding: 10px 15px; background-color: #0066cc; color: white; border-radius: 4px; }
        .btn:hover { background-color: #0052a3; }
        .no-results { text-align: center; padding: 40px; color: #666; }
        .no-results p { font-size: 16px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Kết quả tìm kiếm</h1>
            <a href="/employees/list" class="btn">← Quay lại danh sách</a>
        </div>

        <div class="search-info" th:if="${keyword}">
            <strong>Kết quả tìm kiếm cho:</strong> <span th:text="${keyword}"></span>
            <strong>Tổng số kết quả:</strong> <span th:text="${employees.size()}"></span>
        </div>

        <table th:if="${!employees.isEmpty()}">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Mã</th>
                    <th>Tên</th>
                    <th>Email</th>
                    <th>Phòng ban</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="employee : ${employees}">
                    <td th:text="${employee.id}"></td>
                    <td th:text="${employee.code}"></td>
                    <td th:text="${employee.name}"></td>
                    <td th:text="${employee.email}"></td>
                    <td th:text="${employee.department.name}"></td>
                </tr>
            </tbody>
        </table>

        <div class="no-results" th:if="${employees.isEmpty()}">
            <p>Không tìm thấy nhân viên nào với từ khóa: <strong th:text="${keyword}"></strong></p>
            <a href="/employees/list" class="btn">← Quay lại danh sách</a>
        </div>
    </div>
</body>
</html>
