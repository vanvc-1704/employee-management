<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách nhân viên</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        table th, table td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        table th { background-color: #f2f2f2; font-weight: bold; }
        table tr:hover { background-color: #f5f5f5; }
        a { color: #0066cc; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .btn { display: inline-block; padding: 10px 15px; background-color: #0066cc; color: white; border-radius: 4px; }
        .btn:hover { background-color: #0052a3; }
        .search-box { margin-bottom: 20px; }
        .search-box input { padding: 8px; width: 300px; }
        .search-box button { padding: 8px 15px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .search-box button:hover { background-color: #218838; }
        .no-data { text-align: center; padding: 20px; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Danh sách nhân viên</h1>
            <a href="/employees/add" class="btn">+ Thêm nhân viên</a>
        </div>

        <div class="search-box">
            <form action="/employees/search" method="get">
                <input type="text" name="keyword" placeholder="Tìm kiếm theo tên hoặc phòng ban..." value="">
                <button type="submit">Tìm kiếm</button>
            </form>
        </div>

        <table th:if="${!employees.isEmpty()}">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Mã</th>
                    <th>Tên</th>
                    <th>Email</th>
                    <th>Phòng ban</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="employee : ${employees}">
                    <td th:text="${employee.id}"></td>
                    <td th:text="${employee.code}"></td>
                    <td th:text="${employee.name}"></td>
                    <td th:text="${employee.email}"></td>
                    <td th:text="${employee.department.name}"></td>
                </tr>
            </tbody>
        </table>

        <div class="no-data" th:if="${employees.isEmpty()}">
            <p>Chưa có nhân viên nào. <a href="/employees/add">Thêm nhân viên đầu tiên</a></p>
        </div>
    </div>
</body>
</html>
