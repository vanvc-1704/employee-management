# ==========================================
# Application
# ==========================================
spring.application.name=employee-management
server.port=8080

# ==========================================
# Database - MySQL (default)
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/employee_management?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# Database - PostgreSQL (uncomment to use)
# ==========================================
# spring.datasource.url=jdbc:postgresql://localhost:5432/employee_management
# spring.datasource.username=postgres
# spring.datasource.password=password
# spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# For PostgreSQL use: org.hibernate.dialect.PostgreSQLDialect
